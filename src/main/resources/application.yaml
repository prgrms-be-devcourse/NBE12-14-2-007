spring:
  # 프로젝트 루트의 .env를 properties 파일로 읽어들인다.
  # 아래 플레이스홀더에 기본값이 없으므로 .env가 없으면 앱이 뜨지 않는다.
  # 실행 위치(작업 디렉터리)가 프로젝트 루트여야 .env를 찾는다.
  # OS 환경변수가 있으면 .env 값보다 우선한다.
  config:
    import: optional:file:.env[.properties]
  application:
    name: roomescape
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    # Gmail 일반 비밀번호가 아니라 앱 비밀번호(16자리, 공백 제거)를 넣는다.
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # SMTP가 응답하지 않을 때 요청이 무한정 붙잡히지 않도록 타임아웃을 건다.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

jwt:
  secret: ${JWT_SECRET}
  issuer: roomescape
  access-token-validity-seconds: 1800
  refresh-secret: ${JWT_REFRESH_SECRET}
  refresh-token-validity-seconds: 1209600
  refresh-cleanup-cron: "0 0 4 * * *"

app:
  cookie:
    secure: ${COOKIE_SECURE}
    same-site: ${COOKIE_SAME_SITE}
    path: ${COOKIE_PATH}

auth-mail:
  # 인증 코드 유효시간(분). 로컬 캐시에만 있으므로 앱을 재시작하면 발급된 코드는 무효가 된다.
  expire-minutes: 2
  # 재발송 제한(초). 이걸 안 막으면 메일 폭탄으로 계정이 정지된다.
  resend-cooldown-seconds: 60
  # 인증 통과 후 새 비밀번호를 입력할 때까지 주는 시간(분)
  verified-valid-minutes: 5

r2:
  account-id: ${R2_ACCOUNT_ID}
  access-key: ${R2_ACCESS_KEY}
  secret-key: ${R2_SECRET_KEY}
  bucket: ${R2_BUCKET}
  public-url: ${R2_PUBLIC_URL}

public-api:
  festival:
    url: https://openapi.gg.go.kr/GGCULTUREVENTSTUS #API 서버 주소
    service-key: ${PUBLIC_FESTIVAL_SERVICE_KEY}
    sync-cron: "0 0 6,14,22 * * *"  #배치 실행 주기 6/14/22시 (임의..)
