# 디스코드 알림 설정. 웹훅 URL은 .env 의 DISCORD_WEBHOOK_URL 에서 읽는다.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: discord
    receivers:
      - uid: discord
        type: discord
        settings:
          url: ${DISCORD_WEBHOOK_URL}
          title: '{{ template "discord.ko.title" . }}'
          message: '{{ template "discord.ko.message" . }}'

# 디스코드 메시지를 한국어로 보내기 위한 템플릿.
# 주의: 이 파일은 $로 시작하는 글자를 환경변수로 치환하므로 템플릿 안에서 $ 를 쓰지 않는다.
templates:
  - orgId: 1
    name: discord-ko
    template: |
      {{ define "discord.ko.title" -}}
      {{ if eq .Status "firing" }}🚨 장애 발생{{ else }}✅ 장애 해결{{ end }} - {{ .CommonLabels.alertname }}
      {{- end }}

      {{ define "discord.ko.message" -}}
      {{ range .Alerts.Firing -}}
      🚨 **{{ .Labels.alertname }}**
      {{ .Annotations.summary }}
      발생 시각: {{ .StartsAt | tz "Asia/Seoul" | date "2006-01-02 15:04:05" }}
      🔕 알림 끄기: <{{ .SilenceURL }}>

      {{ end -}}
      {{ range .Alerts.Resolved -}}
      ✅ **{{ .Labels.alertname }}** 정상으로 돌아왔습니다.
      발생 시각: {{ .StartsAt | tz "Asia/Seoul" | date "2006-01-02 15:04:05" }}
      해결 시각: {{ .EndsAt | tz "Asia/Seoul" | date "2006-01-02 15:04:05" }}

      {{ end -}}
      {{- end }}

policies:
  - orgId: 1
    receiver: discord
    group_by: ["alertname"]
    group_wait: 30s
    group_interval: 5m
    # 같은 알림이 계속 켜져 있으면 4시간마다 다시 보낸다.
    repeat_interval: 4h

groups:
  - orgId: 1
    name: roomescape
    folder: roomescape
    interval: 1m
    rules:
      # 앱이 죽었거나 Prometheus가 못 긁어가는 상태
      - uid: roomescape-down
        title: 서버 다운
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: up{job="roomescape"}
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
        noDataState: Alerting
        execErrState: Alerting
        for: 1m
        annotations:
          summary: roomescape 서버에서 메트릭을 수집하지 못하고 있습니다. 서버가 내려갔는지 확인하세요.

      # 최근 5분 요청 중 5xx 비율(%)
      - uid: roomescape-5xx-rate
        title: 5xx 에러율 5% 초과
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              # 5xx가 한 번도 없으면 분자가 비어 결과가 사라지므로 0으로 채운다.
              expr: >-
                (sum(rate(http_server_requests_seconds_count{job="roomescape", status=~"5.."}[5m])) or vector(0))
                / sum(rate(http_server_requests_seconds_count{job="roomescape"}[5m])) * 100
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [5] }
        noDataState: OK
        execErrState: Alerting
        for: 2m
        annotations:
          summary: '최근 5분 5xx 에러율 {{ printf "%.1f" $values.A.Value }}%'

      # 최근 5분 응답시간 p95 (actuator 요청 제외)
      - uid: roomescape-p95-latency
        title: 응답시간 p95 1초 초과
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                histogram_quantile(0.95,
                  sum by (le) (rate(http_server_requests_seconds_bucket{job="roomescape", uri!~"/actuator.*"}[5m])))
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [1] }
        noDataState: OK
        execErrState: Alerting
        for: 2m
        annotations:
          summary: '최근 5분 p95 응답시간 {{ printf "%.2f" $values.A.Value }}초'
